<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body {
        margin: 0; padding: 0; background: transparent; overflow: hidden;
        font-family: "gg sans", "Noto Sans", "Segoe UI", sans-serif; user-select: none;
    }
    #tip {
        display: block; box-sizing: border-box; width: 100%;
        background: rgba(17,18,20,0.97); color: #dbdee1;
        border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
        padding: 6px 8px; font-size: 11px;
    }
    .row { display: flex; justify-content: space-between; gap: 10px; white-space: nowrap; }
    .row b { color: #fff; }
    .muted { color: #949ba4; }
    svg { display: block; margin-top: 5px; }
    img.prev { width: 100%; border-radius: 4px; display: block; margin-bottom: 5px; background: #000; }
    .v { display: flex; align-items: center; gap: 5px; padding: 1px 0; white-space: nowrap; }
    .v img { width: 14px; height: 14px; border-radius: 50%; }
    .v.s { color: #f0b232; }
    .v svg.warn { width: 11px; height: 11px; }
    .act { display: flex; gap: 8px; align-items: center; }
    .act .art { width: 52px; height: 52px; border-radius: 5px; object-fit: cover; flex-shrink: 0; background: #2b2d31; }
    .act .art.small { width: 40px; height: 40px; }
    .act .tx { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .act .kind { color: #949ba4; font-size: 10px; text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
    .act .t1 { color: #fff; font-weight: 600; font-size: 12px; }
    .act .t2, .act .t3 { color: #c4c9ce; }
    .act .t1, .act .t2, .act .t3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; margin-top: 5px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #fff; }
    .times { display: flex; justify-content: space-between; color: #949ba4; font-size: 10px; margin-top: 2px; }
</style>
</head>
<body>
<div id="tip"></div>
<script>
const API = "http://127.0.0.1:17842";
const mode = new URLSearchParams(location.search).get("mode");
const el = document.getElementById("tip");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const avatarUrl = (id, a) => {
    if (a) return `https://cdn.discordapp.com/avatars/${id}/${a}.png?size=32`;
    let i = 0; try { i = Number((BigInt(id) >> 22n) % 6n); } catch (e) {}
    return `https://cdn.discordapp.com/embed/avatars/${i}.png`;
};
function report() {
    requestAnimationFrame(() => {
        const r = el.getBoundingClientRect();
        fetch(API + "/tip/size", { method: "POST", body: JSON.stringify({ w: Math.ceil(r.width), h: Math.ceil(r.height) }) }).catch(() => {});
    });
}

// Ping: now / avg / worst over the last 10 minutes + a sparkline
async function renderPing() {
    let d = {};
    try { d = await (await fetch(API + "/ping/history", { cache: "no-store" })).json(); } catch (e) {}
    const pts = (d.points || []).filter(p => p.v > 0);
    if (!pts.length) { el.innerHTML = `<span class="muted">No ping data</span>`; return report(); }
    const vals = pts.map(p => p.v);
    const max = Math.max(...vals), avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const W = 300, H = 46, t0 = d.now - 10 * 60_000;   // drawn in a fixed box, stretched to the tip's width
    const top = Math.max(100, max * 1.1);
    const x = (t) => Math.max(0, (t - t0) / (10 * 60_000) * W);
    const y = (v) => H - Math.min(H, v / top * H);
    let path = "";
    pts.forEach((p, i) => { path += (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1); });
    const l200 = y(200);
    el.innerHTML = `
        <div class="row"><span>Now <b>${Math.round(vals[vals.length - 1])} ms</b></span><span>avg <b>${Math.round(avg)}</b> · max <b>${Math.round(max)}</b></span></div>
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block">
            <rect width="${W}" height="${H}" fill="rgba(255,255,255,0.03)" rx="3"/>
            ${l200 > 0 ? `<line x1="0" x2="${W}" y1="${l200}" y2="${l200}" stroke="#faa61a" stroke-opacity="0.35" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : ""}
            <path d="${path}" fill="none" stroke="#3ba55d" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="row muted"><span>10 min ago</span><span>now</span></div>`;
    report();
}

// LIVE: the stream's preview (Discord's thumbnail; for my own stream a local
// capture of the streamed window if Discord has none).
async function renderPreview() {
    let st = {}, thumbs = {};
    try { st = await (await fetch(API + "/state", { cache: "no-store" })).json(); } catch (e) {}
    const u = (st.users || []).find(x => x.userId === uidParam);
    let url = u && u.streamPreview;
    if (!url && u && u.isSelf) {
        try { thumbs = (await (await fetch(API + "/sources/thumbs", { cache: "no-store" })).json()).thumbs || {}; } catch (e) {}
        const src = u.streamSourceId || "";
        url = thumbs[src] || (src.startsWith("screen-handle:") ? Object.entries(thumbs).find(([k]) => k.startsWith("screen:"))?.[1] : null);
    }
    el.innerHTML = url ? `<img class="prev" src="${esc(url)}">` : `<span class="muted">No preview yet</span>`;
    const img = el.querySelector("img");
    if (img) img.onload = report;
    report();
}

// Viewer count: who watches my stream
async function renderViewers() {
    let st = {};
    try { st = await (await fetch(API + "/state", { cache: "no-store" })).json(); } catch (e) {}
    const me = (st.users || []).find(u => u.isSelf);
    const v = Array.isArray(me?.viewers) ? me.viewers : [];
    el.innerHTML = v.length
        ? v.map(x => `<div class="v${x.stranger ? " s" : ""}"><img src="${avatarUrl(x.userId, x.avatar)}">${esc(x.name)}${x.stranger ? ` <svg class="warn" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.3 3.7a2 2 0 0 1 3.4 0l8.2 14.1A2 2 0 0 1 20.2 21H3.8a2 2 0 0 1-1.7-3.2l8.2-14.1ZM11 9v5h2V9h-2Zm0 7v2h2v-2h-2Z"/></svg>` : ""}</div>`).join("")
        : `<div class="v muted">No viewers</div>`;
    report();
}

// Someone's activity: art + full status (+ progress for music, elapsed for games)
const uid = new URLSearchParams(location.search).get("uid");
const uidParam = uid;
const KIND = { game: "Playing", listening: "Listening to", watching: "Watching", streaming: "Streaming" };
const mmss = (ms) => { const t = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
async function renderActivity() {
    let st = {};
    try { st = await (await fetch(API + "/state", { cache: "no-store" })).json(); } catch (e) {}
    const u = (st.users || []).find(x => x.userId === uid);
    const a = u && u.activity;
    if (!a) { el.innerHTML = `<span class="muted">No activity</span>`; return report(); }
    const now = Date.now();
    const music = a.type === "listening";
    const art = a.image || a.icon;
    const lines = music
        ? [a.details, a.state ? "by " + a.state : null, a.imageText && a.imageText !== a.details ? "on " + a.imageText : null]
        : [a.name, a.details, a.state];
    let extra = "";
    if (music && a.start && a.end && a.end > a.start) {
        const p = Math.min(1, Math.max(0, (now - a.start) / (a.end - a.start)));
        extra = `<div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div>
                 <div class="times"><span>${mmss(now - a.start)}</span><span>${mmss(a.end - a.start)}</span></div>`;
    } else if (a.start) {
        extra = `<div class="times"><span>for ${mmss(now - a.start)}</span><span></span></div>`;
    }
    el.innerHTML = `<div class="act">
        ${art ? `<img class="art${music ? "" : " small"}" src="${esc(art)}" onerror="this.remove()">` : ""}
        <div class="tx">
            <span class="kind">${esc((KIND[a.type] || "") + (music && a.name ? " " + a.name : ""))}</span>
            ${lines.filter(Boolean).map((l, i) => `<span class="t${i + 1}">${esc(l)}</span>`).join("")}
            ${extra}
        </div>
    </div>`;
    report();
}

const run = mode === "preview" ? renderPreview : mode === "viewers" ? renderViewers
          : mode === "activity" ? renderActivity : renderPing;
run();
setInterval(run, mode === "preview" ? 3000 : mode === "viewers" ? 1500 : 1000);
</script>
</body>
</html>
