<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voice Encounter Overlay</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        background: transparent;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #dcddde;
        font-size: 13px;
        overflow: hidden;
        user-select: none;
        height: 100vh;
    }

    #app {
        height: 100vh;
        padding: 0;
        background: #0e0f12;
        border-radius: 10px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* ─── Header ─── */
    #drag-bar {
        height: 22px;
        flex-shrink: 0;
        -webkit-app-region: drag;
        cursor: grab;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #dcddde;
        background: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        gap: 6px;
    }
    #drag-bar .header-left {
        display: flex;
        align-items: center;
        min-width: 0;
        flex: 1 1 auto;
    }
    #drag-bar .header-right {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
    }
    #drag-bar #channel-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
    }
    #drag-bar .count { opacity: 0.7; }

    #stream-source-btn {
        background: transparent;
        border: none;
        color: #a3a6aa;
        cursor: pointer;
        padding: 2px 3px;
        border-radius: 3px;
        display: inline-flex;
        align-items: center;
        -webkit-app-region: no-drag;
        transition: background 0.1s, color 0.1s;
    }
    #stream-source-btn:hover {
        background: rgba(255,255,255,0.08);
        color: #fff;
    }

    /* ─── Signal bars ─── */
    #signal {
        display: inline-flex;
        align-items: flex-end;
        gap: 1.5px;
        height: 12px;
        cursor: default;
        flex-shrink: 0;
        /* header is a drag region, which eats mouse events; opt out so hover works */
        -webkit-app-region: no-drag;
        padding: 2px;
    }
    #signal .bar {
        display: inline-block;
        width: 3px;
        border-radius: 1px;
        background: currentColor;
        opacity: 0.25;
        transition: background 0.2s, opacity 0.2s;
    }
    #signal .bar:nth-child(1) { height: 4px; }
    #signal .bar:nth-child(2) { height: 6px; }
    #signal .bar:nth-child(3) { height: 8px; }
    #signal .bar:nth-child(4) { height: 10px; }

    #signal[data-level="ok"] { color: #3ba55d; }
    #signal[data-level="ok"] .bar { opacity: 1; }

    #signal[data-level="unstable"] { color: #faa61a; }
    #signal[data-level="unstable"] .bar:nth-child(1),
    #signal[data-level="unstable"] .bar:nth-child(2),
    #signal[data-level="unstable"] .bar:nth-child(3) { opacity: 1; }
    #signal[data-level="unstable"] .bar:nth-child(4) { opacity: 0.25; }

    #signal[data-level="critical"] { color: #ff8c00; }
    #signal[data-level="critical"] .bar:nth-child(1),
    #signal[data-level="critical"] .bar:nth-child(2) { opacity: 1; }
    #signal[data-level="critical"] .bar:nth-child(3),
    #signal[data-level="critical"] .bar:nth-child(4) { opacity: 0.25; }

    #signal[data-level="lost"] { color: #ed4245; }
    #signal[data-level="lost"] .bar:nth-child(1) { opacity: 1; }
    #signal[data-level="lost"] .bar:nth-child(2),
    #signal[data-level="lost"] .bar:nth-child(3),
    #signal[data-level="lost"] .bar:nth-child(4) { opacity: 0.25; }

    #signal[data-level="off"] {
        color: #4a4d52;
        pointer-events: none;
    }
    #signal[data-level="off"] .bar { opacity: 0.35; }

    #signal-tip {
        display: none;
        position: fixed; z-index: 1000;
        padding: 3px 7px; border-radius: 4px;
        background: rgba(17,18,20,0.95); color: #dbdee1;
        font-size: 11px; white-space: nowrap; pointer-events: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* ─── Network banner ─── */
    #net {
        display: none;
        flex-shrink: 0;
        padding: 3px 10px 4px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    #net[data-level="unstable"] {
        display: block;
        color: #faa61a;
        background: rgba(250, 166, 26, 0.06);
    }
    #net[data-level="critical"] {
        display: block;
        color: #ff8c00;
        background: rgba(255, 140, 0, 0.08);
    }
    #net[data-level="lost"] {
        display: block;
        color: #ed4245;
        background: rgba(237, 66, 69, 0.10);
    }
    #net .net-line-1 {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        line-height: 1.2;
    }
    #net .net-line-2 {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        font-size: 9px;
        font-weight: 500;
        opacity: 0.85;
        letter-spacing: 0.3px;
        margin-top: 1px;
        text-transform: none;
    }
    #net .net-line-2 .net-left,
    #net .net-line-2 .net-right {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
    }
    #net .net-line-2 .net-right { opacity: 0.9; }
    #net .net-line-2 .net-sep {
        display: inline-block;
        width: 1px;
        height: 9px;
        margin: 0 8px;
        background: currentColor;
        opacity: 0.35;
        flex-shrink: 0;
    }

    /* ─── User list ─── */
    #users-wrap {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 6px;
        display: flex;
        flex-direction: column;
    }
    #users-wrap::-webkit-scrollbar { width: 4px; }
    #users-wrap::-webkit-scrollbar-track { background: transparent; }
    #users-wrap::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 2px;
        transition: background 0.15s;
    }
    #users-wrap:hover::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.15);
    }
    #users { flex: 0 0 auto; }

    #empty {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0.55;
        font-size: 11px;
        padding: 0;
        text-align: center;
        line-height: 1.5;
        white-space: pre-line;
        color: #a3a6aa;
    }
    #empty.offline {
        color: #ed4245;
        opacity: 0.9;
        font-weight: 600;
        letter-spacing: 0.3px;
    }
    #empty.idle {
        color: #a3a6aa;
        opacity: 0.7;
    }

    .user {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 2px;
        border-radius: 6px;
        transition: background 0.15s;
    }
    .user:hover { background: rgba(255, 255, 255, 0.04); }

    .user .avatar-wrap {
        position: relative;
        width: 24px;
        height: 24px;
        flex-shrink: 0;
    }
    /* Activity (game / Spotify / ...) and phone icons next to the name */
    .user .act-ico {
        width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; object-fit: cover;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .user .act-ico svg { width: 13px; height: 13px; display: block; }
    .user span.act-ico { color: #b5bac1; }
    /* Game icons stay monochrome in the list (the overlay is muted on purpose);
       colour comes back on hover and in the tooltip. */
    .user img.act-ico { filter: grayscale(1); opacity: 0.75; transition: filter .15s, opacity .15s; }
    .user img.act-ico:hover { filter: none; opacity: 1; }
    .user .act-txt {
        font-size: 10px; color: #949ba4; flex-shrink: 1; min-width: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px;
    }
    .user .mobile-ico { width: 10px; height: 13px; color: #949ba4; flex-shrink: 0; }
    .vs-live.self-live { cursor: default; }
    .user .mylive { display: inline-flex; align-items: center; flex-shrink: 0; }
    .hdr-ico { width: 11px; height: 11px; vertical-align: -1px; margin-right: 3px; }
    .vcard .go svg { width: 14px; height: 14px; display: block; }
    /* My stream's viewer count: a quiet grey pill next to LIVE */
    .user .viewers {
        display: inline-flex; align-items: center; gap: 3px; margin-left: 3px;
        padding: 0 5px; height: 15px; border-radius: 8px; box-sizing: border-box;
        background: rgba(255,255,255,0.08); color: #dbdee1;
        font-size: 10px; font-weight: 600; line-height: 1; position: relative; cursor: default;
    }
    .user .viewers .eye-ico { width: 11px; height: 11px; color: #b5bac1; }
    /* Someone unexpected is watching: a small yellow dot, not a yellow badge */
    .user .viewers.warn::after {
        content: ""; position: absolute; top: -1px; right: -1px;
        width: 6px; height: 6px; border-radius: 50%; background: #f0b232;
        box-shadow: 0 0 0 1.5px #1e1f22;
    }
    .cam-btn { cursor: pointer; display: inline-flex; }
    .cam-btn:hover { filter: brightness(1.6); }
    /* Unread DMs from this person */
    .user .dm-badge {
        position: absolute; right: -4px; bottom: -3px;
        min-width: 15px; height: 15px; padding: 0 3px; box-sizing: border-box;
        border-radius: 8px; background: #ed4245; color: #fff;
        font-size: 9px; font-weight: 700; line-height: 1;
        display: flex; align-items: center; justify-content: center;
        border: 2px solid #1e1f22; pointer-events: none; font-variant-numeric: tabular-nums;
    }
    .user .avatar-wrap img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #2f3136;
        transition: box-shadow 0.12s ease-out;
    }
    .user.speaking .avatar-wrap img {
        box-shadow: 0 0 0 2px #3ba55d,
                    0 0 8px 1px rgba(59, 165, 93, 0.5);
    }

    .user .name {
        flex: 0 1 auto;
        max-width: 140px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
        min-width: 0;
    }
    .user.self .name {
        font-weight: 600;
        opacity: 0.85;
    }

    .user .spacer { flex: 1 1 auto; min-width: 0; }

    .user .actions {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
        margin-right: 4px;
    }
    #users-wrap:hover .user .actions {
        opacity: 1;
        pointer-events: auto;
    }

    .user .act {
        background: transparent;
        border: none;
        color: #a3a6aa;
        cursor: pointer;
        padding: 3px;
        line-height: 1;
        border-radius: 3px;
        transition: background 0.1s, color 0.1s;
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .user .act:hover {
        background: rgba(255,255,255,0.08);
        color: #fff;
    }
    .user .act svg {
        width: 13px;
        height: 13px;
        display: block;
        pointer-events: none;
        fill: currentColor;
    }
    .user .act.active { color: #fff; }

    .user .act.block           { color: #a3a6aa; }
    .user .act.block:hover     { color: #ed4245; }
    .user .act.block.active    { color: #ed4245; }

    .user .act.ignore          { color: #a3a6aa; }
    .user .act.ignore:hover    { color: #faa61a; }
    .user .act.ignore.active   { color: #faa61a; }

    .user .act.mute            { color: #a3a6aa; }
    .user .act.mute.active     { color: #72767d; }

    .user .act.self-mute.active   { color: #ed4245; }
    .user .act.self-deaf.active   { color: #ed4245; }
    .user .act.self-stream.active { color: #9146ff; }

    .user .vstatus {
        display: flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
        margin-right: 4px;
        line-height: 1;
    }
    .user .vstatus .vs-svg {
        width: 14px;
        height: 14px;
        display: inline-block;
        flex-shrink: 0;
        color: #72767d;
        transition: color 0.4s ease-out, opacity 0.4s ease-out;
    }
    .user .vstatus .vs-svg.self     { color: #72767d; opacity: 0.9; }
    .user .vstatus .vs-svg.server   { color: #ed4245; }
    .user .vstatus .vs-svg.video    { color: #3ba55d; }

    .user .vstatus .vs-svg.recent {
        color: #ffd24a;
        opacity: 1;
    }
    .user .vstatus .vs-svg.pulse {
        animation: vsPulseYellow 0.9s ease-in-out infinite;
    }
    @keyframes vsPulseYellow {
        0%   { color: #ffd24a; }
        50%  { color: #72767d; }
        100% { color: #ffd24a; }
    }
    .user .vstatus .vs-svg.recent-unmute {
        color: #57f287;
        opacity: 1;
    }
    .user .vstatus .vs-svg.pulse-unmute {
        animation: vsPulseGreen 0.9s ease-in-out infinite;
    }
    @keyframes vsPulseGreen {
        0%   { color: #57f287; }
        50%  { color: #72767d; }
        100% { color: #57f287; }
    }

    .user .vs-live {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 1px 5px;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.4px;
        line-height: 1.2;
        color: #fff;
        background: #ed4245;
        border-radius: 999px;
        cursor: pointer;
        -webkit-app-region: no-drag;
        user-select: none;
        text-transform: uppercase;
        flex-shrink: 0;
        margin-right: 4px;
    }
    .user .vs-live:hover { background: #c93b3e; }

    .user .badge {
        font-size: 13px;
        font-weight: bold;
        line-height: 1;
        flex-shrink: 0;
        width: 14px;
        text-align: center;
    }

    .user.just-joined {
        animation: joinFlash 1.2s ease-out;
    }
    @keyframes joinFlash {
        0%   { background: rgba(88, 101, 242, 0.25); }
        100% { background: transparent; }
    }
    /* Favorites flash yellow */
    .user.fav.just-joined { animation: favFlash 1.6s ease-out; }
    @keyframes favFlash {
        0%   { background: rgba(250, 200, 40, 0.38); }
        100% { background: transparent; }
    }

    /* Leave voice (header, left of the stream button): hold, the ring closes, then we leave */
    #leave-btn {
        position: relative;
        width: 17px; height: 17px;
        background: transparent; border: none; padding: 0;
        color: #a3a6aa; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
        -webkit-app-region: no-drag;
        border-radius: 50%;
    }
    #leave-btn.hidden { display: none; }
    #leave-btn:hover { color: #ed4245; background: rgba(237,66,69,0.12); }
    #leave-btn .ico { width: 11px; height: 11px; }
    #leave-btn .ring {
        position: absolute; inset: 0; width: 17px; height: 17px;
        transform: rotate(-90deg); pointer-events: none;
    }
    #leave-btn .ring circle {
        fill: none; stroke: #ed4245; stroke-width: 2;
        stroke-dasharray: 50.27; stroke-dashoffset: 50.27;
        transition: stroke-dashoffset 0.18s ease-out;
    }
    #leave-btn.holding .ring circle {
        stroke-dashoffset: 0;
        transition: stroke-dashoffset 800ms linear;
    }
    #stream-source-btn.hidden { display: none; }

    /* Session note: one line under the list, gone when you leave the channel */
    #note {
        display: none; margin: 0 4px 4px; padding: 4px 7px; min-height: 26px; box-sizing: border-box;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 5px;
        color: #c4c9ce; font-size: 11px; line-height: 16px; cursor: text;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        -webkit-app-region: no-drag;
    }
    #note.show { display: block; }
    #note input {
        width: 100%; background: transparent; border: none; outline: none; color: #fff;
        font: inherit; padding: 0;
    }
    /* After leaving voice: a small table for a minute and a half */
    .vstats {
        margin: 6px 4px 0; padding: 5px 7px 6px; border-radius: 5px; box-sizing: border-box;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
        font-size: 10px; color: #b5bac1;
    }
    .vstats table { width: 100%; border-collapse: collapse; }
    .vstats th { font-weight: 600; color: #80848e; text-align: right; padding: 0 0 2px 8px; font-size: 9px; text-transform: uppercase; letter-spacing: .3px; }
    .vstats th:first-child { text-align: left; padding-left: 0; }
    .vstats td { padding: 1px 0 1px 8px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 14px; }
    .vstats td:first-child { text-align: left; padding-left: 0; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
    .vstats td.who { display: flex; align-items: center; gap: 4px; }
    .vstats td.who img { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .vstats td.who span { overflow: hidden; text-overflow: ellipsis; }
    .vstats tr.me td { color: #fff; font-weight: 600; }
    .vstats .z { color: #5c5f66; }
    /* Cards: "-> #channel" after someone moved, and "return to channel" */
    #cards { display: flex; flex-direction: column; gap: 4px; padding: 0 4px 4px; }
    #cards:empty { display: none; }
    .vcard {
        display: flex; align-items: center; gap: 6px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 6px; padding: 4px 6px;
        cursor: pointer; font-size: 11px; color: #dbdee1;
        min-height: 32px; box-sizing: border-box;
        -webkit-app-region: no-drag;
    }
    .vcard:hover { background: rgba(88,101,242,0.18); border-color: rgba(88,101,242,0.5); }
    .vcard .who { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
    .vcard .txt { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
    .vcard .t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vcard .t1 b { color: #fff; font-weight: 600; }
    .vcard .t2 { color: #a3a6aa; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vcard .members { display: flex; flex-shrink: 0; }
    .vcard .members img {
        width: 16px; height: 16px; border-radius: 50%;
        border: 1.5px solid #1e1f22; margin-left: -5px; background: #2b2d31;
    }
    .vcard .members img:first-child { margin-left: 0; }
    .vcard .more { font-size: 10px; color: #a3a6aa; margin-left: 3px; align-self: center; }
    .vcard .x {
        background: transparent; border: none; color: #80848e; cursor: pointer;
        font-size: 13px; line-height: 1; padding: 0 2px; flex-shrink: 0;
    }
    .vcard .x:hover { color: #fff; }
    .vcard.ret { border-color: rgba(59,165,93,0.45); }
    .vcard.ret:hover { background: rgba(59,165,93,0.18); border-color: rgba(59,165,93,0.8); }
    .vcard .go { color: #3ba55d; font-weight: 600; flex-shrink: 0; }

    /* Window layouts: setup mode (translucent, dashed frame, countdown) */
    body.setup #app { outline: 2px dashed #5865f2; outline-offset: -2px; cursor: move; }
    #setup-banner {
        display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 100;
        background: #5865f2; color: #fff; font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 10px;
        pointer-events: none; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    body.setup #setup-banner { display: block; }

    /* Click-through mode (game has focus, cursor hidden) */
    body.click-through {
        pointer-events: none !important;
    }
    body.click-through #app {
        opacity: 0.55;
        filter: grayscale(0.6);
        transition: opacity 0.2s, filter 0.2s;
    }
    body.click-through .vs-live { pointer-events: none; }
</style>
</head>
<body>

<div id="setup-banner"></div>
<div id="app">
    <div id="drag-bar">
        <span class="header-left">
            <span id="channel-name">Voice</span>
        </span>
        <span class="header-right">
            <button id="leave-btn" class="hidden" type="button" title="Hold to leave voice">
                <svg class="ring" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8"/></svg>
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.1 13.2c.6.6.6 1.5 0 2.1l-1.4 1.4c-.5.5-1.3.6-1.9.2l-2.3-1.6c-.4-.3-.7-.8-.7-1.3v-1.6a12.6 12.6 0 0 0-5.6 0V14c0 .5-.3 1-.7 1.3l-2.3 1.6c-.6.4-1.4.3-1.9-.2l-1.4-1.4c-.6-.6-.6-1.5 0-2.1C5.4 10.6 8.6 9.5 12 9.5s6.6 1.1 9.1 3.7Z"/></svg>
            </button>
            <button id="stream-source-btn" type="button" title="Stream source">
                <svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true">
                    <path fill="currentColor" d="M4 4a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h16a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H4Zm0 2h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/>
                </svg>
            </button>
            <span id="signal" data-level="ok">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </span>
            <span class="count" id="count"></span>
        </span>
    </div>

    <div id="net" data-level="ok">
        <div class="net-line-1" id="net-line-1"></div>
        <div class="net-line-2">
            <span class="net-left" id="net-left"></span>
            <span class="net-sep"></span>
            <span class="net-right" id="net-right"></span>
        </div>
    </div>

    <div id="users-wrap">
        <div id="users"></div>
        <div id="empty" class="idle">NOT IN VOICE</div>
    </div>
    <div id="note" title="Session note — click to edit, clear it to remove. Right-click your own card to add one."></div>
    <div id="cards"></div>
</div>

<script>
const API_STATE    = "http://127.0.0.1:17842/state";
const API_SPEAKING = "http://127.0.0.1:17842/speaking";
const API_COMMAND  = "http://127.0.0.1:17842/command";
const API_EVENTS   = "http://127.0.0.1:17842/events";

const REFRESH_STATE_MS    = 250;
const REFRESH_SPEAKING_MS = 40;

const RECENT_WINDOW_MS   = 30_000;
const PULSE_WINDOW_MS    = 15_000;
const JOINED_MS          = 1200;

const PENDING_TTL_MS     = 2000;

const PATH_MUTE =
    "m2.7 22.7 20-20a1 1 0 0 0-1.4-1.4l-20 20a1 1 0 1 0 1.4 1.4Z" +
    "M10.8 17.32c-.21.21-.1.58.2.62V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.06A8 8 0 0 0 20 10a1 1 0 0 0-2 0c0 1.45-.52 2.79-1.38 3.83l-.02.02A5.99 5.99 0 0 1 12.32 16a.52.52 0 0 0-.34.15l-1.18 1.18Z" +
    "M15.36 4.52c.15-.15.19-.38.08-.56A4 4 0 0 0 8 6v4c0 .3.03.58.1.86.07.34.49.43.74.18l6.52-6.52Z" +
    "M5.06 13.98c.16.28.53.31.75.09l.75-.75c.16-.16.19-.4.08-.61A5.97 5.97 0 0 1 6 10a1 1 0 0 0-2 0c0 1.45.39 2.81 1.06 3.98Z";

const PATH_DEAF =
    "M22.7 2.7a1 1 0 0 0-1.4-1.4l-20 20a1 1 0 1 0 1.4 1.4l20-20Z" +
    "M17.06 2.94a.48.48 0 0 0-.11-.77A11 11 0 0 0 2.18 16.94c.14.3.53.35.76.12l3.2-3.2c.25-.25.15-.68-.2-.76a5 5 0 0 0-1.02-.1H3.05a9 9 0 0 1 12.66-9.2c.2.09.44.05.59-.1l.76-.76Z" +
    "M20.2 8.28a.52.52 0 0 1 .1-.58l.76-.76a.48.48 0 0 1 .77.11 11 11 0 0 1-4.5 14.57c-1.27.71-2.73.23-3.55-.74a3.1 3.1 0 0 1-.17-3.78l1.38-1.97a5 5 0 0 1 4.1-2.13h1.86a9.1 9.1 0 0 0-.75-4.72Z" +
    "M10.1 17.9c.25-.25.65-.18.74.14a3.1 3.1 0 0 1-.62 2.84 2.85 2.85 0 0 1-3.55.74.16.16 0 0 1-.04-.25l3.48-3.48Z";

const PATH_MIC =
    "M12 2a4 4 0 0 0-4 4v4a4 4 0 0 0 8 0V6a4 4 0 0 0-4-4Z" +
    "M6 10a1 1 0 0 0-2 0 8 8 0 0 0 7 7.94V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.06A8 8 0 0 0 20 10a1 1 0 1 0-2 0 6 6 0 0 1-12 0Z";

const PATH_HEADPHONES =
    "M12 3a9 9 0 0 0-8.95 10h1.87a5 5 0 0 1 4.1 2.13l1.37 1.97a3.1 3.1 0 0 1-.17 3.78 " +
    "2.85 2.85 0 0 1-3.55.74 11 11 0 1 1 10.66 0c-1.27.71-2.73.23-3.55-.74a3.1 3.1 0 0 1-.17-3.78l1.38-1.97a5 5 0 0 1 4.1-2.13h1.86A9 9 0 0 0 12 3Z";

const PATH_VIDEO =
    "M4 4a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h11a3 3 0 0 0 3-3v-2.12a1 1 0 0 0 .55.9l3 1.5a1 1 0 0 0 1.45-.9V7.62a1 1 0 0 0-1.45-.9l-3 1.5a1 1 0 0 0-.55.9V7a3 3 0 0 0-3-3H4Z";

const PATH_FORBIDDEN =
    "M12 2C6.486 2 2 6.486 2 12C2 17.514 6.486 22 12 22C17.514 22 22 17.514 22 12C22 6.486 17.514 2 12 2ZM12 4C16.411 4 20 7.589 20 12C20 13.847 19.374 15.545 18.314 16.892L7.108 5.686C8.455 4.626 10.153 4 12 4ZM4 12C4 10.153 4.626 8.455 5.686 7.108L16.892 18.314C15.545 19.374 13.847 20 12 20C7.589 20 4 16.411 4 12Z";

const PATH_STREAM =
    "M2 5a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V5Zm13.35 8.13 3.5 4.67c.37.5.02 1.2-.6 1.2H5.81a.75.75 0 0 1-.59-1.22l1.86-2.32a1.5 1.5 0 0 1 2.34 0l.5.64 2.23-2.97a2 2 0 0 1 3.2 0ZM10.2 5.98c.23-.91-.88-1.55-1.55-.9a.93.93 0 0 1-1.3 0c-.67-.65-1.78-.01-1.55.9a.93.93 0 0 1-.65 1.12c-.9.26-.9 1.54 0 1.8.48.14.77.63.65 1.12-.23.91.88 1.55 1.55.9a.93.93 0 0 1 1.3 0c.67.65 1.78.01 1.55-.9a.93.93 0 0 1 .65-1.12c.9-.26.9-1.54 0-1.8a.93.93 0 0 1-.65-1.12Z";

const PATH_BY_KIND = {
    mute: PATH_MUTE,
    deaf: PATH_DEAF,
    mic:  PATH_MIC,
    headphones: PATH_HEADPHONES,
    video: PATH_VIDEO
};

const elChannelName = document.getElementById("channel-name");
const elCount       = document.getElementById("count");
const elUsers       = document.getElementById("users");
const elUsersWrap   = document.getElementById("users-wrap");
const elEmpty       = document.getElementById("empty");
const elNet         = document.getElementById("net");
const elNetLine1    = document.getElementById("net-line-1");
const elNetLeft     = document.getElementById("net-left");
const elNetRight    = document.getElementById("net-right");
const elSignal      = document.getElementById("signal");

// Custom tooltip: native title tooltips don't show reliably in the overlay window
let signalTip = "—";
const elSignalTip = document.createElement("div");
elSignalTip.id = "signal-tip";
document.body.appendChild(elSignalTip);
let signalTipTimer = null;
elSignal.addEventListener("mouseenter", () => {
    clearTimeout(signalTipTimer);
    signalTipTimer = setTimeout(showSignalTip, 400);
});
// Ping graph (last 10 min) opens in a separate tip window below the icon.
let openTipKey = null;
function openTipAt(mode, el, uid) {
    const key = mode + ":" + (uid || "");
    if (openTipKey === key) return;          // already showing (e.g. the list re-rendered under the cursor)
    openTipKey = key;
    const r = el.getBoundingClientRect();
    fetch("http://127.0.0.1:17842/tip/open", {
        method: "POST", headers: { "Content-Type": "application/json" },
        // Under the whole overlay block, same width, on top of everything
        // (the notification block included).
        body: JSON.stringify({
            mode, uid: uid || null,
            x: window.screenX, y: window.screenY + window.innerHeight + 3, w: window.innerWidth
        })
    }).catch(() => {});
}
function closeTip() { openTipKey = null; fetch("http://127.0.0.1:17842/tip/close", { method: "POST" }).catch(() => {}); }
function showSignalTip() { openTipAt("ping", elSignal); }
elSignal.addEventListener("mouseleave", () => {
    clearTimeout(signalTipTimer);
    closeTip();
});

let currentUsers   = [];
let selfEnteredAt  = 0;      // when I came into the current channel (my row flashes)
let speakingSet    = new Set();
let knownJoinTime  = new Map();
let lastChannelId  = null;
let lastStateSig   = "";

let flashIconOnMute = true;

let netState = {
    level: "ok",
    since: 0,
    phaseMs: 0,
    totalMs: 0,
    last: null,
    avg: null,
    updatedAt: 0
};

const pendingEdits = new Map();

function badgeFor(kind) {
    switch (kind) {
        case "blocked": return { glyph: "⊘", color: "#ed4245" };
        case "ignored": return { glyph: "⊘", color: "#faa61a" };
        case "muted":   return { glyph: "○", color: "#72767d" };
        case "known":   return { glyph: "✓", color: "#3ba55d" };
        default:        return { glyph: "!", color: "#a3a6aa" };
    }
}

function avatarUrl(u) {
    if (u.avatar) return `https://cdn.discordapp.com/avatars/${u.userId}/${u.avatar}.png?size=64`;
    const idx = Number((BigInt(u.userId) >> 22n) % 6n);
    return `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
}

function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
    }[c]));
}

function showMessage(kind, text, channelLabel) {
    elChannelName.textContent = channelLabel || "Voice";
    elCount.textContent = "";
    elUsers.innerHTML = "";
    elEmpty.style.display = "flex";
    elEmpty.className = kind;
    elEmpty.textContent = text;
    lastStateSig = "";
    lastChannelId = null;
    knownJoinTime.clear();
    speakingSet.clear();
    pendingEdits.clear();
    renderNet(null, false);
    renderCards([]);
    elSrcBtn.classList.add("hidden");
    elLeaveBtn.classList.add("hidden");
    renderNote(null);
}

function iconSvg(kind, classes, title) {
    const d = PATH_BY_KIND[kind] || "";
    const cls = classes.filter(Boolean).join(" ");
    const tAttr = title ? ` title="${esc(title)}"` : "";
    return `<svg class="vs-svg ${cls}" viewBox="0 0 24 24" aria-hidden="true"${tAttr}>` +
           `<path fill="currentColor" d="${d}"/></svg>`;
}

function actionButton(action, title, active, svgPath, userId) {
    const cls = `act ${action}${active ? " active" : ""}`;
    return `<button class="${cls}" data-act="${esc(action)}" data-uid="${esc(userId)}" title="${esc(title)}">` +
           `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${svgPath}"/></svg>` +
           `</button>`;
}

function liveBadgeHtml(u) {
    if (!u.streaming) return "";
    if (u.isSelf) {
        const v = Array.isArray(u.viewers) ? u.viewers : [];
        const warn = v.some(x => x.stranger) ? " warn" : "";
        return `<span class="mylive" data-mylive="1"><span class="vs-live self-live">LIVE</span>` +
            (v.length ? `<span class="viewers${warn}" title="Viewers"><svg class="eye-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.7 9.4 1.6 11.4a1.3 1.3 0 0 0 0 1.2C2.7 14.6 6.5 19 12 19s9.3-4.4 10.4-6.4a1.3 1.3 0 0 0 0-1.2C21.3 9.4 17.5 5 12 5Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg><span>${v.length}</span></span>` : "") + `</span>`;
    }
    return `<span class="vs-live" data-act="watch-stream" data-uid="${esc(u.userId)}" ` +
           `title="Streaming — click to watch">LIVE</span>`;
}

function voiceStatusHtml(u, now) {
    const parts = [];

    if (u.video) {
        parts.push(u.isSelf ? iconSvg("video", ["video"], "Camera on")
            : `<span class="cam-btn" data-act="watch-camera" data-uid="${esc(u.userId)}" title="Camera on — click to watch">${iconSvg("video", ["video"], "")}</span>`);
    }

    const computeFlash = (at) => {
        const age = at > 0 ? (now - at) : Infinity;
        const recent  = flashIconOnMute && at > 0 && age < RECENT_WINDOW_MS;
        const pulsing = recent && age < PULSE_WINDOW_MS;
        return { recent, pulsing };
    };

    if (u.selfMute) {
        const { recent, pulsing } = computeFlash(u.selfMuteAt);
        const cls = ["self"];
        if (recent)  cls.push("recent");
        if (pulsing) cls.push("pulse");
        parts.push(iconSvg("mute", cls, recent ? "Recently muted themselves" : "Muted"));
    } else if (u.selfUnmuteAt) {
        const { recent, pulsing } = computeFlash(u.selfUnmuteAt);
        if (recent) {
            const cls = ["self", "recent-unmute"];
            if (pulsing) cls.push("pulse-unmute");
            parts.push(iconSvg("mic", cls, "Recently unmuted themselves"));
        }
    }

    if (u.selfDeaf) {
        const { recent, pulsing } = computeFlash(u.selfDeafAt);
        const cls = ["self"];
        if (recent)  cls.push("recent");
        if (pulsing) cls.push("pulse");
        parts.push(iconSvg("deaf", cls, recent ? "Recently deafened themselves" : "Deafened"));
    } else if (u.selfUndeafAt) {
        const { recent, pulsing } = computeFlash(u.selfUndeafAt);
        if (recent) {
            const cls = ["self", "recent-unmute"];
            if (pulsing) cls.push("pulse-unmute");
            parts.push(iconSvg("headphones", cls, "Recently undeafened themselves"));
        }
    }

    if (u.serverMute) parts.push(iconSvg("mute", ["server"], "Server muted"));
    if (u.serverDeaf) parts.push(iconSvg("deaf", ["server"], "Server deafened"));

    if (parts.length === 0) return "";
    return `<div class="vstatus">${parts.join("")}</div>`;
}

// Music: the platform's icon. Games: the game's icon. Details in a tooltip.
// Monochrome (currentColor) platform marks; the arcs/holes are cut out with a
// mask so they show whatever is behind the card.
const PLATFORM_SVG = {
    spotify: `<svg viewBox="0 0 24 24"><mask id="m-sp"><rect width="24" height="24" fill="#fff"/><g fill="none" stroke="#000" stroke-linecap="round"><path d="M6.6 9.7Q12 7.7 17.5 10.5" stroke-width="2"/><path d="M7.3 12.9Q12 11.3 16.7 13.6" stroke-width="1.7"/><path d="M8 15.9Q12 14.7 15.8 16.5" stroke-width="1.4"/></g></mask><circle cx="12" cy="12" r="10.5" fill="currentColor" mask="url(#m-sp)"/></svg>`,
    soundcloud: `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="12.5" width="1.4" height="4.5" rx=".7"/><rect x="4.4" y="11" width="1.4" height="6" rx=".7"/><rect x="6.8" y="9.8" width="1.4" height="7.2" rx=".7"/><rect x="9.2" y="8.8" width="1.4" height="8.2" rx=".7"/><path d="M11.6 8.2a5.3 5.3 0 0 1 7.3 3.6A2.7 2.7 0 0 1 19.4 17h-7.8z"/></svg>`,
    youtube: `<svg viewBox="0 0 24 24"><mask id="m-yt"><rect width="24" height="24" fill="#fff"/><path d="M10 8.8v6.4l5.4-3.2z" fill="#000"/></mask><rect x="1.5" y="5" width="21" height="14" rx="4" fill="currentColor" mask="url(#m-yt)"/></svg>`,
    apple: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 3.5v11.2a2.8 2.8 0 1 1-1.7-2.6V7.4l-7 1.5v7.8a2.8 2.8 0 1 1-1.7-2.6V5.6z"/></svg>`,
    music: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 3.5v11.2a2.8 2.8 0 1 1-1.7-2.6V7.4l-7 1.5v7.8a2.8 2.8 0 1 1-1.7-2.6V5.6z"/></svg>`
};
function activityHtml(a, userId) {
    if (!a || a.type === "custom") return "";
    const attrs = `class="act-ico" data-acttip="${esc(userId)}"`;
    if (a.platform && PLATFORM_SVG[a.platform]) return `<span ${attrs}>${PLATFORM_SVG[a.platform]}</span>`;
    if (a.icon) return `<img ${attrs} src="${esc(a.icon)}" onerror="this.remove()">`;
    if (a.image) return `<img ${attrs} src="${esc(a.image)}" onerror="this.remove()">`;
    return `<span class="act-txt" data-acttip="${esc(userId)}">${esc(a.name)}</span>`;
}

function renderUsersList(now = Date.now()) {
    if (currentUsers.length === 0) {
        elUsers.innerHTML = "";
        return;
    }

    elUsers.innerHTML = currentUsers.map(u => {
        const b = badgeFor(u.kind);

        const joinedAt = u.isSelf ? selfEnteredAt : (knownJoinTime.get(u.userId) ?? 0);
        const justJoined = (joinedAt > 0 && (now - joinedAt) < JOINED_MS) ? " just-joined" : "";

        const speakingCls = speakingSet.has(u.userId) ? " speaking" : "";
        const selfCls = u.isSelf ? " self" : "";
        const favCls = u.favorite ? " fav" : "";

        const shownName = u.displayName || u.username || "(unknown)";
        const titleAttr = u.displayName && u.displayName !== u.username
            ? `${u.displayName} (@${u.username})`
            : u.username;

        let actions = "";

        if (u.isSelf) {
            const mutePath = u.selfMute ? PATH_MUTE : PATH_MIC;
            const deafPath = u.selfDeaf ? PATH_DEAF : PATH_HEADPHONES;

            actions = `<div class="actions">` +
                actionButton("self-mute",
                             u.selfMute ? "Unmute yourself" : "Mute yourself",
                             u.selfMute, mutePath, u.userId) +
                actionButton("self-deaf",
                             u.selfDeaf ? "Undeafen yourself" : "Deafen yourself",
                             u.selfDeaf, deafPath, u.userId) +
                actionButton("self-stream",
                             u.streaming ? "Stop your stream" : "Start streaming your screen",
                             u.streaming, PATH_STREAM, u.userId) +
                `</div>`;
        } else {
            actions = `<div class="actions">` +
                actionButton(u.blocked ? "unblock" : "block",
                             u.blocked ? "Unblock" : "Block",
                             u.blocked, PATH_FORBIDDEN, u.userId) +
                actionButton(u.ignored ? "unignore" : "ignore",
                             u.ignored ? "Unignore" : "Ignore",
                             u.ignored, PATH_FORBIDDEN, u.userId) +
                actionButton(u.muted ? "unmute" : "mute",
                             u.muted ? "Unmute" : "Mute in voice",
                             u.muted, PATH_MUTE, u.userId) +
                `</div>`;
        }

        return `<div class="user${justJoined}${speakingCls}${selfCls}${favCls}" data-user-id="${u.userId}">
            <div class="avatar-wrap">
                <img src="${avatarUrl(u)}" onerror="this.style.opacity='0.3'">
                ${u.unreadDM > 0 ? `<span class="dm-badge" title="${u.unreadDM} unread in DM">${u.unreadDM > 9 ? "9+" : u.unreadDM}</span>` : ""}
            </div>
            <span class="name" title="${esc(titleAttr)}">${esc(shownName)}</span>
            ${u.mobile ? `<svg class="mobile-ico" viewBox="0 0 10 14" aria-hidden="true"><title>On phone</title><rect x="1" y="0.8" width="8" height="12.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5" cy="10.6" r="0.9" fill="currentColor"/></svg>` : ""}
            ${activityHtml(u.activity, u.userId)}
            ${voiceStatusHtml(u, now)}
            ${liveBadgeHtml(u)}
            <span class="spacer"></span>
            ${actions}
            <span class="badge" style="color:${b.color}" title="${u.kind}">${b.glyph}</span>
        </div>`;
    }).join("");
}

function renderNet(net, active = true) {
    // No ping data -> grey, never "ok" green
    if (!active || !net) {
        elSignal.setAttribute("data-level", "off");
        signalTip = "—";
    } else {
        const level = net.level || "ok";
        elSignal.setAttribute("data-level", level);

        const lastOk = typeof net.last === "number" && isFinite(net.last) && net.last > 0;
        const avgOk  = typeof net.avg  === "number" && isFinite(net.avg)  && net.avg  > 0;
        signalTip = lastOk
            ? `${Math.round(net.last)} ms` + (avgOk ? ` · avg ${Math.round(net.avg)} ms` : "")
            : "—";
    }
    if (elSignalTip.style.display === "block") elSignalTip.textContent = signalTip;

    if (!active || !net || net.level === "ok") {
        elNet.setAttribute("data-level", "ok");
        elNetLine1.textContent = "";
        elNetLeft.textContent = "";
        elNetRight.textContent = "";
        return;
    }

    elNet.setAttribute("data-level", net.level);

    const line1 = {
        unstable: "UNSTABLE CONNECTION",
        critical: "CRITICAL CONNECTION · CHECK NETWORK",
        lost:     "CONNECTION LOST"
    }[net.level] || "";

    const lastTxt = (typeof net.last === "number") ? `${Math.round(net.last)} ms` : "—";
    const avgTxt  = (typeof net.avg  === "number") ? `${Math.round(net.avg)} ms`  : "—";

    const phaseTxt = net.phaseMs > 0
        ? `${Math.round(net.phaseMs / 1000)}s`
        : "0s";
    const totalTxt = net.totalMs > 0
        ? `${Math.round(net.totalMs / 1000)}s`
        : "0s";

    elNetLine1.textContent = line1;
    elNetLeft.textContent  = `ping ${lastTxt} · avg ${avgTxt}`;
    elNetRight.textContent = `${phaseTxt} / ${totalTxt}`;
}

function applyPendingEdits(users) {
    const now = Date.now();
    for (const u of users) {
        const fields = pendingEdits.get(u.userId);
        if (!fields) continue;
        for (const field of Object.keys(fields)) {
            const entry = fields[field];
            if (now >= entry.until) {
                delete fields[field];
                continue;
            }
            u[field] = entry.value;
            if (field === "selfMute") {
                if (entry.value) { u.selfMuteAt = now; u.selfUnmuteAt = 0; }
                else             { u.selfMuteAt = 0; u.selfUnmuteAt = now; }
            } else if (field === "selfDeaf") {
                if (entry.value) { u.selfDeafAt = now; u.selfUndeafAt = 0; }
                else             { u.selfDeafAt = 0; u.selfUndeafAt = now; }
            }
        }
        if (Object.keys(fields).length === 0) pendingEdits.delete(u.userId);
    }
}

function renderState(data) {
    const pluginAlive = data.pluginAlive !== false;
    const users = Array.isArray(data.users) ? data.users : [];
    const channelId = data.channelId ?? null;

    flashIconOnMute = data?.prefs?.flashIconOnMute !== false;

    const net = data && data.net ? data.net : null;

    if (!pluginAlive) {
        renderNet(null, false);
        showMessage("offline", "PLUGIN OFFLINE\nVoice Encounter Tracker not connected", "Voice");
        return;
    }

    if (!channelId) {
        renderNet(net, false);
        showMessage("idle", "NOT IN VOICE\nJoin a voice channel", "Voice");
        renderNet(net, false);
        elSrcBtn.classList.add("hidden");
        elLeaveBtn.classList.add("hidden");
        favPresence = null;
        renderCards([
            ...(data.leaveStats ? [{ kind: "stats", ...data.leaveStats }] : []),
            ...(data.returnTo ? [{ kind: "return", ...data.returnTo }] : [])
        ]);
        return;
    }
    elSrcBtn.classList.remove("hidden");
    elLeaveBtn.classList.remove("hidden");
    renderNote(data.note || null);
    playFavoriteTones(channelId, users);
    renderCards((data.departures || []).map(d => ({ kind: "departure", ...d })));

    renderNet(net, true);

    elEmpty.style.display = users.length === 0 ? "flex" : "none";
    if (users.length === 0) {
        elEmpty.className = "idle";
        elEmpty.textContent = "Waiting for voice states…";
    }

    // I came into a channel (or the overlay just opened): everyone already
    // there is not "new" — only my own row flashes.
    const entering = channelId !== lastChannelId;
    if (entering) {
        knownJoinTime.clear();
        lastChannelId = channelId;
        lastStateSig = "";
        pendingEdits.clear();
    }

    const now = Date.now();

    applyPendingEdits(users);

    users.forEach((u, i) => {
        if (knownJoinTime.has(u.userId)) return;
        // keep the incoming order; old enough not to flash
        knownJoinTime.set(u.userId, entering ? now - 60_000 + i : now);
    });
    if (entering) selfEnteredAt = now;
    const present = new Set(users.map(u => u.userId));
    for (const id of [...knownJoinTime.keys()]) {
        if (!present.has(id)) knownJoinTime.delete(id);
    }

    users.sort((a, b) => {
        const ta = knownJoinTime.get(a.userId) ?? 0;
        const tb = knownJoinTime.get(b.userId) ?? 0;
        return ta - tb;
    });

    elChannelName.innerHTML = data.isDM
        ? `<svg class="hdr-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1l-2.2 2.2Z"/></svg>${esc(data.channelName || "DM call")}`
        : esc(data.channelName || "Voice");
    elCount.textContent = users.length ? `(${users.length})` : "";

    const bucket = ts => {
        if (!ts || !flashIconOnMute) return 3;
        const age = now - ts;
        if (age < PULSE_WINDOW_MS) return 1;
        if (age < RECENT_WINDOW_MS) return 2;
        return 3;
    };

    const sig = users.map(u =>
        `${u.userId}:${u.kind}:${u.blocked?1:0}:${u.ignored?1:0}:${u.muted?1:0}:${u.isSelf?1:0}` +
        `:${u.selfMute?1:0}:${u.selfDeaf?1:0}:${u.serverMute?1:0}:${u.serverDeaf?1:0}` +
        `:${u.streaming?1:0}:${u.video?1:0}:${u.suppress?1:0}:${u.favorite?1:0}:${u.unreadDM||0}` +
        `:${u.mobile?1:0}:${u.activity ? (u.activity.platform || "") + "/" + (u.activity.state || "") : ""}:${Array.isArray(u.viewers) ? u.viewers.map(v => v.userId + (v.stranger ? "!" : "")).join(",") : ""}:${u.activity ? u.activity.type + "/" + u.activity.name + "/" + (u.activity.icon || "") + "/" + (u.activity.details || "") : ""}` +
        `:${bucket(u.selfMuteAt)}:${bucket(u.selfDeafAt)}` +
        `:${bucket(u.selfUnmuteAt)}:${bucket(u.selfUndeafAt)}`
    ).join("|") +
        `|pref:${flashIconOnMute ? 1 : 0}` +
        `|net:${net?.level || "ok"}:${net?.last ?? -1}:${net?.avg ?? -1}`;

    if (sig !== lastStateSig) {
        lastStateSig = sig;
        currentUsers = users;
        renderUsersList(now);
    }
}

function applySpeaking(newSpeakers) {
    speakingSet = new Set(newSpeakers);
    const rows = elUsers.querySelectorAll(".user");
    rows.forEach(row => {
        const userId = row.getAttribute("data-user-id");
        const shouldSpeak = speakingSet.has(userId);
        const has = row.classList.contains("speaking");
        if (shouldSpeak && !has) row.classList.add("speaking");
        else if (!shouldSpeak && has) row.classList.remove("speaking");
    });
}

async function tickState() {
    try {
        const res = await fetch(API_STATE, { cache: "no-store" });
        if (!res.ok) throw new Error("bad status");
        const data = await res.json();
        renderState(data);
    } catch (e) {
        renderNet(null, false);
        showMessage("offline", "PLUGIN OFFLINE\nOverlay server unreachable", "Voice");
    }
    setTimeout(tickState, REFRESH_STATE_MS);
}

async function tickSpeaking() {
    try {
        const res = await fetch(API_SPEAKING, { cache: "no-store" });
        if (!res.ok) throw new Error("bad status");
        const data = await res.json();
        applySpeaking(Array.isArray(data.speakers) ? data.speakers : []);
    } catch (e) {}
    setTimeout(tickSpeaking, REFRESH_SPEAKING_MS);
}

function sendCommand(action, userId) {
    fetch(API_COMMAND, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, userId })
    }).catch(() => {});
}

function optimisticToggle(userId, field) {
    const u = currentUsers.find(x => x.userId === userId);
    if (!u) return;

    const now = Date.now();
    const edits = [];

    if (field === "selfMute") {
        const newMute = !u.selfMute;
        if (newMute === false && u.selfDeaf === true) {
            edits.push({ field: "selfMute", value: false });
            edits.push({ field: "selfDeaf", value: false });
        } else if (newMute === true) {
            edits.push({ field: "selfMute", value: true });
        } else {
            edits.push({ field: "selfMute", value: false });
        }
    } else if (field === "selfDeaf") {
        const newDeaf = !u.selfDeaf;
        if (newDeaf === true) {
            edits.push({ field: "selfDeaf", value: true });
            edits.push({ field: "selfMute", value: true });
        } else {
            edits.push({ field: "selfDeaf", value: false });
        }
    } else if (field === "streaming") {
        edits.push({ field: "streaming", value: !u.streaming });
    }

    if (edits.length === 0) return;

    let fields = pendingEdits.get(userId);
    if (!fields) {
        fields = {};
        pendingEdits.set(userId, fields);
    }

    for (const f of Object.keys(fields)) {
        fields[f].until = now + PENDING_TTL_MS;
    }

    for (const { field: f, value } of edits) {
        fields[f] = { value, until: now + PENDING_TTL_MS };
    }

    for (const { field: f, value } of edits) {
        u[f] = value;

        if (f === "selfMute") {
            if (value) { u.selfMuteAt = now; u.selfUnmuteAt = 0; }
            else       { u.selfMuteAt = 0; u.selfUnmuteAt = now; }
        } else if (f === "selfDeaf") {
            if (value) { u.selfDeafAt = now; u.selfUndeafAt = 0; }
            else       { u.selfDeafAt = 0; u.selfUndeafAt = now; }
        }
    }

    renderUsersList(now);
}

elUsers.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    const action = btn.getAttribute("data-act");
    const userId = btn.getAttribute("data-uid");
    if (!action) return;

    if (action === "watch-camera") { postCommand({ action: "watch-camera", userId }); return; }
    if (action === "watch-stream") {
        fetch(API_COMMAND, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "watch-stream", userId })
        }).catch(() => {});
        return;
    }

    if (!userId) return;

    if (action === "self-mute")        optimisticToggle(userId, "selfMute");
    else if (action === "self-deaf")   optimisticToggle(userId, "selfDeaf");
    else if (action === "self-stream") optimisticToggle(userId, "streaming");

    sendCommand(action, userId);
});

// ─── Favorites: a short tone when they join or leave (only favorites with
// sound on; everyone else stays silent). Tones are generated, no files. ───
let favPresence = null;      // { channelId, ids: Set } of favorites with sound
let audioCtx = null;

function tone(notes) {
    try {
        audioCtx = audioCtx || new AudioContext();
        const t0 = audioCtx.currentTime + 0.01;
        notes.forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = "sine";
            o.frequency.value = f;
            const st = t0 + i * 0.11;
            g.gain.setValueAtTime(0, st);
            g.gain.linearRampToValueAtTime(0.16, st + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, st + 0.22);
            o.connect(g).connect(audioCtx.destination);
            o.start(st);
            o.stop(st + 0.25);
        });
    } catch (e) {}
}

function playFavoriteTones(channelId, users) {
    const ids = new Set(users.filter(u => u.favorite && u.favSound).map(u => u.userId));
    // First look at a channel (joined it, overlay just opened): no sounds.
    if (!favPresence || favPresence.channelId !== channelId) {
        favPresence = { channelId, ids };
        return;
    }
    let joined = false, left = false;
    for (const id of ids) if (!favPresence.ids.has(id)) joined = true;
    for (const id of favPresence.ids) if (!ids.has(id)) {
        // Only a favorite with sound who actually left, not one whose sound got turned off.
        if (!users.some(u => u.userId === id)) left = true;
    }
    favPresence = { channelId, ids };
    if (joined) tone([660, 880]);          // up: came in
    else if (left) tone([880, 587]);       // down: went out
}

// ─── Cards under the list ───
const elCards = document.getElementById("cards");
let lastCardsSig = "";

function memberRow(c) {
    const imgs = (c.members || []).map(m =>
        `<img src="${avatarUrl({ userId: m.userId, avatar: m.avatar })}" title="${esc(m.name)}" onerror="this.style.opacity='0.3'">`
    ).join("");
    const more = c.count > (c.members || []).length ? `<span class="more">+${c.count - c.members.length}</span>` : "";
    return imgs ? `<span class="members">${imgs}</span>${more}` : "";
}

function renderCards(cards) {
    const sig = JSON.stringify(cards);
    if (sig === lastCardsSig) return;
    lastCardsSig = sig;
    const hm = (ms) => { const m = Math.round(ms / 60000); return m < 60 ? m + "m" : Math.floor(m / 60) + "h" + (m % 60 ? " " + (m % 60) + "m" : ""); };
    elCards.innerHTML = cards.map(c => {
        if (c.kind === "stats") {
            const t = (ms) => ms ? hm(ms) : `<span class="z">—</span>`;
            return `<div class="vstats"><table>
                <tr><th></th><th>Session</th><th>Today</th></tr>
                <tr class="me"><td>You</td><td>${t(c.sessionMs)}</td><td>${t(c.todayMs)}</td></tr>
                ${(c.people || []).map(p => `<tr><td class="who"><img src="${avatarUrl({ userId: p.userId, avatar: p.avatar })}" onerror="this.style.opacity='0.3'"><span>${esc(p.name)}</span></td><td>${t(p.sessionMs)}</td><td>${t(p.todayMs)}</td></tr>`).join("")}
            </table></div>`;
        }
        if (c.kind === "return") {
            const where = c.guildName ? ` · ${esc(c.guildName)}` : "";
            const who = c.count ? `${c.count} in channel` : "nobody there now";
            return `<div class="vcard ret" data-card="return" data-cid="${esc(c.channelId)}" title="Rejoin #${esc(c.channelName || "")}">
                <span class="txt">
                    <span class="t1">Return to <b>#${esc(c.channelName || "channel")}</b>${where}</span>
                    <span class="t2">${who}</span>
                </span>
                ${memberRow(c)}
                <span class="go"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.7 5.3a1 1 0 0 1 0 1.4L7.4 9H14a6 6 0 0 1 0 12h-3a1 1 0 1 1 0-2h3a4 4 0 0 0 0-8H7.4l2.3 2.3a1 1 0 1 1-1.4 1.4l-4-4a1 1 0 0 1 0-1.4l4-4a1 1 0 0 1 1.4 0Z"/></svg></span>
                <button class="x" data-dismiss="return" title="Dismiss">×</button>
            </div>`;
        }
        return `<div class="vcard" data-card="departure" data-cid="${esc(c.channelId)}" data-uid="${esc(c.userId)}" title="Join #${esc(c.channelName || "")}">
            <img class="who" src="${avatarUrl({ userId: c.userId, avatar: c.avatar })}" onerror="this.style.opacity='0.3'">
            <span class="txt">
                <span class="t1"><b>${esc(c.name)}</b> → #${esc(c.channelName || "channel")}</span>
                <span class="t2">${c.count} in channel</span>
            </span>
            ${memberRow(c)}
            <button class="x" data-dismiss="departure" data-uid="${esc(c.userId)}" title="Dismiss">×</button>
        </div>`;
    }).join("");
}

function postCommand(body) {
    fetch(API_COMMAND, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    }).catch(() => {});
}

elCards.addEventListener("click", (e) => {
    e.stopPropagation();
    const x = e.target.closest("[data-dismiss]");
    if (x) {
        const kind = x.getAttribute("data-dismiss");
        if (kind === "return") postCommand({ action: "dismiss-return" });
        else postCommand({ action: "dismiss-departure", userId: x.getAttribute("data-uid") });
        x.closest(".vcard")?.remove();
        return;
    }
    const card = e.target.closest(".vcard");
    if (!card) return;
    postCommand({ action: "join-channel", channelId: card.getAttribute("data-cid") });
    card.style.opacity = "0.5";
});

// ─── Leave voice: hold until the ring closes ───
const elLeaveBtn = document.getElementById("leave-btn");
const LEAVE_HOLD_MS = 800;
let leaveTimer = null;

function cancelLeave() {
    if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; }
    elLeaveBtn.classList.remove("holding");
}
elLeaveBtn.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    try { elLeaveBtn.setPointerCapture(e.pointerId); } catch (err) {}
    elLeaveBtn.classList.add("holding");
    leaveTimer = setTimeout(() => {
        leaveTimer = null;
        elLeaveBtn.classList.remove("holding");
        postCommand({ action: "leave-voice" });
    }, LEAVE_HOLD_MS);
});
for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) elLeaveBtn.addEventListener(ev, cancelLeave);
elLeaveBtn.addEventListener("click", (e) => e.stopPropagation());

// ─── Activity icon: hover shows a bigger tooltip (art + full status) ───
let actTipTimer = null;
// Moving between the icon's own parts (span > svg > path) fires mouseover /
// mouseout too; only react when the pointer really enters or leaves the icon.
const crossed = (e, sel) => {
    const el = e.target.closest(sel);
    if (!el) return null;
    const other = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest(sel) : null;
    return other === el ? null : el;
};
elUsers.addEventListener("mouseover", (e) => {
    const b = crossed(e, "[data-acttip]");
    if (!b) return;
    clearTimeout(actTipTimer);
    actTipTimer = setTimeout(() => openTipAt("activity", b, b.getAttribute("data-acttip")), 250);
});
elUsers.addEventListener("mouseout", (e) => {
    if (!crossed(e, "[data-acttip]")) return;
    clearTimeout(actTipTimer);
    closeTip();
});

// ─── My LIVE badge: hover shows a preview of what I stream + who watches ───
let tipTimer = null;
elUsers.addEventListener("mouseover", (e) => {
    const b = crossed(e, "[data-mylive]");
    if (!b) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => openTipAt("mylive", b), 250);
});
elUsers.addEventListener("mouseout", (e) => {
    if (!crossed(e, "[data-mylive]")) return;
    clearTimeout(tipTimer);
    closeTip();
});

// ─── Window layouts: setup mode painted by the overlay app ───
window.__vetSetup = (label) => {
    document.body.classList.toggle("setup", !!label);
    const b = document.getElementById("setup-banner");
    if (label) b.textContent = "Drag me · " + label;
};

// ─── Session note ───
const elNote = document.getElementById("note");
let noteText = null;
let noteEditing = false;
function renderNote(text) {
    noteText = text;
    if (noteEditing) return;
    elNote.classList.toggle("show", !!text);
    elNote.textContent = text || "";
}
function editNote() {
    if (noteEditing) return;
    noteEditing = true;
    fetch("http://127.0.0.1:17842/note/editing", { method: "POST", body: JSON.stringify({ on: true }) }).catch(() => {});
    elNote.classList.add("show");
    elNote.innerHTML = `<input type="text" maxlength="300" placeholder="Note for this session (Enter to save)">`;
    const inp = elNote.querySelector("input");
    inp.value = noteText || "";
    const finish = (save) => {
        if (!noteEditing) return;
        noteEditing = false;
        fetch("http://127.0.0.1:17842/note/editing", { method: "POST", body: JSON.stringify({ on: false }) }).catch(() => {});
        if (save) {
            const t = inp.value.trim();
            fetch("http://127.0.0.1:17842/note", { method: "POST", body: JSON.stringify({ text: t }) }).catch(() => {});
            renderNote(t || null);
        } else renderNote(noteText);
    };
    inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
    inp.addEventListener("blur", () => finish(true));
    setTimeout(() => inp.focus(), 20);
}
elNote.addEventListener("click", (e) => { e.stopPropagation(); editNote(); });

// ─── Right-click a person: quick-action menu (opens at the cursor) ───
elUsers.addEventListener("contextmenu", (e) => {
    const row = e.target.closest(".user");
    if (!row) return;
    e.preventDefault();
    // Right-click your own card: session note
    if (row.classList.contains("self")) { editNote(); return; }
    fetch("http://127.0.0.1:17842/menu/open", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: row.getAttribute("data-user-id"), x: e.screenX, y: e.screenY })
    }).catch(() => {});
});

// ─── Stream source picker button ───
const elSrcBtn = document.getElementById("stream-source-btn");

elSrcBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    fetch("http://127.0.0.1:17842/popup/open", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ winId: window.__vetWinId || null })
    }).catch(() => {});
});

// Live updates via SSE; fall back to polling only while the stream is down.
let sseConnected = false;
let pollTimer = null;

function showOffline() {
    renderNet(null, false);
    showMessage("offline", "PLUGIN OFFLINE\nOverlay server unreachable", "Voice");
}

function startFallbackPoll() {
    if (pollTimer) return;
    const poll = async () => {
        if (sseConnected) { pollTimer = null; return; }
        try {
            const [st, sp] = await Promise.all([
                fetch(API_STATE, { cache: "no-store" }).then(r => r.json()),
                fetch(API_SPEAKING, { cache: "no-store" }).then(r => r.json())
            ]);
            renderState(st);
            applySpeaking(Array.isArray(sp.speakers) ? sp.speakers : []);
        } catch (e) { showOffline(); }
        pollTimer = setTimeout(poll, 1000);
    };
    pollTimer = setTimeout(poll, 0);
}

function connectEvents() {
    const es = new EventSource(API_EVENTS);
    es.addEventListener("open", () => { sseConnected = true; });
    es.addEventListener("state", (e) => {
        try { renderState(JSON.parse(e.data)); } catch (err) {}
    });
    es.addEventListener("speaking", (e) => {
        try {
            const d = JSON.parse(e.data);
            applySpeaking(Array.isArray(d.speakers) ? d.speakers : []);
        } catch (err) {}
    });
    es.addEventListener("error", () => {
        // EventSource reconnects by itself (retry: 1000)
        sseConnected = false;
        startFallbackPoll();
    });
}

connectEvents();
</script>
