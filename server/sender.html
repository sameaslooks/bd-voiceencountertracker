<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stream Sender (test)</title>
<style>
    html, body {
        background: #000;
        color: #fff;
        font-family: monospace;
        font-size: 12px;
        padding: 8px;
    }
</style>
</head>
<body>
<div id="log">sender starting…</div>

<script>
const API_BASE = "http://127.0.0.1:17842";
const elLog = document.getElementById("log");

function log(...args) {
    console.log("[sender]", ...args);
    elLog.textContent = args.join(" ") + "\n" + elLog.textContent;
}

async function postJSON(path, body) {
    const r = await fetch(API_BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
    });
    return r.json();
}

async function getJSON(path) {
    const r = await fetch(API_BASE + path, { cache: "no-store" });
    return r.json();
}

async function start() {
    try { await postJSON("/webrtc/reset"); } catch (e) {}

    // Get a screen capture MediaStream from Electron (main-process desktopCapturer).
    // We can't call desktopCapturer from renderer, but navigator.mediaDevices
    // with chromeMediaSource works in Electron.
    log("requesting screen…");
    const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
            mandatory: {
                chromeMediaSource: "desktop",
                chromeMediaSourceId: "screen:0:0"
            }
        }
    });
    log("got stream, tracks:", stream.getTracks().map(t => t.kind).join(","));

    const pc = new RTCPeerConnection({ iceServers: [] });
    const iceForSender = [];

    for (const track of stream.getTracks()) {
        pc.addTrack(track, stream);
    }

    pc.onicecandidate = (event) => {
        if (event.candidate) iceForSender.push(event.candidate.toJSON());
    };

    pc.onconnectionstatechange = () => {
        log("state:", pc.connectionState);
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await new Promise((resolve) => {
        if (pc.iceGatheringState === "complete") return resolve();
        const check = () => {
            if (pc.iceGatheringState === "complete") {
                pc.removeEventListener("icegatheringstatechange", check);
                resolve();
            }
        };
        pc.addEventListener("icegatheringstatechange", check);
        setTimeout(resolve, 1500);
    });

    await postJSON("/webrtc/offer", { offer: pc.localDescription.toJSON() });
    await postJSON("/webrtc/ice", { for: "receiver", candidates: iceForSender });
    log("offer sent, waiting for answer…");

    let answer = null;
    for (let i = 0; i < 40; i++) {
        const data = await getJSON("/webrtc/answer");
        if (data && data.answer) { answer = data.answer; break; }
        await new Promise(r => setTimeout(r, 250));
    }
    if (!answer) { log("no answer"); return; }

    await pc.setRemoteDescription(answer);
    log("answer set");

    const iceTimer = setInterval(async () => {
        const data = await getJSON("/webrtc/ice?for=sender");
        if (data && Array.isArray(data.candidates)) {
            for (const c of data.candidates) {
                try { await pc.addIceCandidate(c); } catch (e) {}
            }
        }
    }, 500);
    setTimeout(() => clearInterval(iceTimer), 30000);
}

start().catch(e => {
    log("ERROR:", e.message);
    console.error(e);
});
</script>
</body>
</html>
