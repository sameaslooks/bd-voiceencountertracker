<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stream Viewer</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        background: transparent;
        color: #dcddde;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        overflow: hidden;
        user-select: none;
        height: 100vh;
    }
    #root {
        position: relative;
        width: 100vw; height: 100vh;
        background: #000;
        overflow: hidden;
    }
    #view {
        width: 100%; height: 100%;
        background: #000;
        display: block;
    }
    #view.zoomable { cursor: zoom-in; }
    #view.zoomed { cursor: zoom-out; }
    #view.panning { cursor: grabbing; }
    #zoom-badge {
        position: absolute; left: 6px; bottom: 6px; z-index: 7;
        background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; font-weight: 600;
        padding: 2px 5px; border-radius: 3px; pointer-events: none; display: none;
    }
    #zoom-badge.show { display: block; }
    #controls {
        position: absolute; top: 0; left: 0; right: 0; height: 28px;
        display: flex; align-items: center; justify-content: flex-end; gap: 4px;
        padding: 0 6px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0));
        -webkit-app-region: drag;
        opacity: 0; transition: opacity 0.15s;
        z-index: 10000;
    }
    #root:hover #controls,
    #controls.show { opacity: 1; }
    .btn {
        -webkit-app-region: no-drag;
        background: rgba(255,255,255,0.08);
        border: none; color: #fff; cursor: pointer;
        border-radius: 3px; padding: 3px 6px; font-size: 11px;
        display: inline-flex; align-items: center; justify-content: center;
        line-height: 1; min-width: 22px; height: 20px;
    }
    .btn:hover { background: rgba(255,255,255,0.18); }
    .btn.active { background: rgba(88,101,242,0.85); color: #fff; }
    .btn svg { width: 12px; height: 12px; display: block; }

    #alpha-pop {
        position: absolute; top: 28px; right: 34px;
        background: rgba(0,0,0,0.85);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 4px;
        padding: 6px 8px;
        display: none;
        align-items: center;
        gap: 6px;
        -webkit-app-region: no-drag;
        z-index: 10001;
        color: #fff;
    }
    #alpha-pop.show { display: flex; }
    #alpha-range { width: 120px; accent-color: #5865f2; }
    #alpha-val { width: 32px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.8; }

    #last-frame {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain; background: #000;
        display: none; pointer-events: none; z-index: 4;
    }
    #last-frame.show { display: block; }
    #reconnect {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(6px) grayscale(0.6) brightness(0.6);
        -webkit-backdrop-filter: blur(6px) grayscale(0.6) brightness(0.6);
        pointer-events: none; z-index: 6;
        opacity: 0; transition: opacity 0.25s ease;
    }
    #reconnect.show { opacity: 1; }
    #reconnect .card {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 14px 8px 10px;
        background: rgba(18,19,22,0.78);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.45);
        max-width: calc(100% - 24px);
    }
    #reconnect .spinner {
        flex: none;
        width: 18px; height: 18px;
        border: 2px solid rgba(255,255,255,0.15);
        border-top-color: #5865f2;
        border-radius: 50%;
        animation: vet-spin 0.8s linear infinite;
    }
    #reconnect .text { display: flex; flex-direction: column; min-width: 0; }
    #reconnect .title { font-size: 12px; font-weight: 600; color: #f2f3f5; white-space: nowrap; }
    #reconnect .sub {
        font-size: 11px; color: #949ba4; margin-top: 1px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #reconnect .sub:empty { display: none; }
    @keyframes vet-spin { to { transform: rotate(360deg); } }

    #status {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        color: #72767d; font-size: 12px;
        pointer-events: none; z-index: 5;
    }
</style>
</head>
<body>
<div id="root">
    <canvas id="view"></canvas>
    <div id="zoom-badge"></div>
    <img id="last-frame" alt="">
    <div id="controls">
        <button class="btn" id="btn-alpha" title="Opacity">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a10 10 0 1 0 0 20V2z" opacity="0.9"/>
                <path d="M12 2a10 10 0 1 1 0 20V2z" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
        </button>
        <button class="btn" id="btn-pin" title="Preview mode (small corner)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h6v2H6v4H4V4Zm10 0h6v6h-2V6h-4V4ZM4 14h2v4h4v2H4v-6Zm14 0h2v6h-6v-2h4v-4Z"/></svg>
        </button>
        <button class="btn" id="btn-close" title="Close">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
        </button>
    </div>
    <div id="alpha-pop">
        <span>Alpha</span>
        <input id="alpha-range" type="range" min="20" max="100" step="1" value="100">
        <span id="alpha-val">100%</span>
    </div>
    <div id="status">Waiting for stream…</div>
    <div id="reconnect">
        <div class="card">
            <div class="spinner"></div>
            <div class="text">
                <div class="title" id="reconnect-text">Reconnecting…</div>
                <div class="sub" id="reconnect-sub"></div>
            </div>
        </div>
    </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:17842";
const elView = document.getElementById("view");
const elStatus = document.getElementById("status");
const ctx = elView.getContext("2d", { alpha: false });

let pc = null;
let readerLoopRunning = false;

// Smooth playout. The source delivers frames in bursts (gaps of 200-350 ms
// about once a second, with matching timestamps, so WebRTC's own jitter buffer
// can't fix it). We copy every decoded frame into an ImageBitmap right away
// (and close the VideoFrame so the decoder pool is never starved), queue the
// bitmaps and show them at an even pace, keeping ~BUFFER_MS of frames in stock.
const BUFFER_MS = 500;          // target stock; must exceed the largest burst gap (seen up to ~375 ms)
const MAX_BUFFER_MS = 900;      // above this, drop old frames to catch up
const queue = [];               // ImageBitmap[]
let srcFps = 60;                // measured input rate (EMA)
const arrivals = [];
let nextDue = 0;
let playing = false;
let raf = 0;
function log(...args) { console.log("[video]", ...args); }
function setStatus(txt) {
    if (!elStatus) return;
    if (!txt) elStatus.style.display = "none";
    else { elStatus.style.display = "flex"; elStatus.textContent = txt; }
}

function fitCanvas() {
    const w = Math.max(1, elView.clientWidth);
    const h = Math.max(1, elView.clientHeight);
    if (elView.width !== w || elView.height !== h) {
        elView.width = w;
        elView.height = h;
    }
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

// Tell the overlay the stream's aspect ratio so the window keeps it (no black bars).
let reportedAspect = 0;
function reportAspect(w, h) {
    const a = w / h;
    if (Math.abs(a - reportedAspect) < 0.01) return;
    reportedAspect = a;
    fetch(API_BASE + "/video/aspect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ width: w, height: h })
    }).catch(() => {});
}

// ── Black-bar detection ──
// Discord often pads the picture (e.g. 16:9 content inside a 16:10 frame).
// To avoid cropping dark scenes, a crop is accepted only when:
//   - the bars are symmetric (top≈bottom or left≈right), and
//   - what remains has a standard aspect ratio (16:9, 21:9, 4:3, ...), and
//   - the same result is seen 3 probes in a row (~4.5 s).
// Once set, the crop is NOT dropped in dark scenes; it is dropped only when
// picture content shows up inside the bar area, or the resolution changes.
const probe = document.createElement("canvas");
const probeCtx = probe.getContext("2d", { willReadFrequently: true });
let crop = null;            // { x, y, w, h, vw, vh } in source pixels
let cropCandidate = null;
let cropHits = 0;
let barContentHits = 0;
let lastProbeAt = 0;
const STD_ASPECTS = [16/9, 21/9, 64/27, 32/9, 4/3, 16/10];

function isDarkLine(data, w, idx, horizontal, from, to) {
    let bright = 0;
    const n = to - from;
    for (let i = from; i < to; i += 2) {
        const p = horizontal ? (idx * w + i) * 4 : (i * w + idx) * 4;
        if (data[p] + data[p + 1] + data[p + 2] > 3 * 24) { if (++bright > n * 0.02) return false; }
    }
    return true;
}

function readProbe(frame, vw, vh) {
    const pw = 192, ph = Math.max(1, Math.round(pw * vh / vw));
    if (probe.width !== pw || probe.height !== ph) { probe.width = pw; probe.height = ph; }
    probeCtx.drawImage(frame, 0, 0, pw, ph);
    return { data: probeCtx.getImageData(0, 0, pw, ph).data, pw, ph };
}

function detectBars(data, pw, ph, vw, vh) {
    let top = 0, bottom = 0, left = 0, right = 0;
    while (top < ph / 3 && isDarkLine(data, pw, top, true, 0, pw)) top++;
    while (bottom < ph / 3 && isDarkLine(data, pw, ph - 1 - bottom, true, 0, pw)) bottom++;
    while (left < pw / 3 && isDarkLine(data, pw, left, false, 0, ph)) left++;
    while (right < pw / 3 && isDarkLine(data, pw, pw - 1 - right, false, 0, ph)) right++;
    if (top >= ph / 3 || left >= pw / 3) return undefined;          // too dark to tell

    const sym = (a, b, n) => a > 1 && b > 1 && Math.abs(a - b) <= Math.max(2, n * 0.02);
    const vert = sym(top, bottom, ph), horiz = sym(left, right, pw);
    if (!vert && !horiz) return null;

    const sx = vw / pw, sy = vh / ph;
    const t = vert ? (top + 1) * sy : 0, b = vert ? (bottom + 1) * sy : 0;
    const l = horiz ? (left + 1) * sx : 0, r = horiz ? (right + 1) * sx : 0;
    const c = { x: Math.round(l), y: Math.round(t), w: Math.round(vw - l - r), h: Math.round(vh - t - b), vw, vh };
    const aspect = c.w / c.h;
    if (!STD_ASPECTS.some(a => Math.abs(aspect - a) / a < 0.04)) return null;
    // Snap height/width to the exact standard ratio (centred) to avoid a dark fringe.
    const std = STD_ASPECTS.find(a => Math.abs(aspect - a) / a < 0.04);
    if (vert) { const h = Math.round(c.w / std); c.y += Math.round((c.h - h) / 2); c.h = h; }
    else { const w = Math.round(c.h * std); c.x += Math.round((c.w - w) / 2); c.w = w; }
    return c;
}

// Is there picture content inside the currently cropped-off area?
function barsHaveContent(data, pw, ph) {
    const ty = Math.floor(crop.y * ph / crop.vh) - 1;
    const by = Math.ceil((crop.y + crop.h) * ph / crop.vh) + 1;
    const lx = Math.floor(crop.x * pw / crop.vw) - 1;
    const rx = Math.ceil((crop.x + crop.w) * pw / crop.vw) + 1;
    for (let y = 0; y < ty; y++) if (!isDarkLine(data, pw, y, true, 0, pw)) return true;
    for (let y = by; y < ph; y++) if (!isDarkLine(data, pw, y, true, 0, pw)) return true;
    for (let x = 0; x < lx; x++) if (!isDarkLine(data, pw, x, false, 0, ph)) return true;
    for (let x = rx; x < pw; x++) if (!isDarkLine(data, pw, x, false, 0, ph)) return true;
    return false;
}

function sameCrop(a, b) {
    if (!a || !b) return a === b;
    return Math.abs(a.x - b.x) < 4 && Math.abs(a.y - b.y) < 4 && Math.abs(a.w - b.w) < 6 && Math.abs(a.h - b.h) < 6;
}

function probeCrop(frame, vw, vh) {
    if (crop && (crop.vw !== vw || crop.vh !== vh)) { crop = null; log("crop reset: resolution changed"); }
    const { data, pw, ph } = readProbe(frame, vw, vh);
    if (crop) {
        // Keep the crop through dark scenes; drop it only if the bars show picture.
        if (barsHaveContent(data, pw, ph)) {
            if (++barContentHits >= 2) { crop = null; barContentHits = 0; log("crop removed: content in bar area"); }
        } else barContentHits = 0;
        return;
    }
    const c = detectBars(data, pw, ph, vw, vh);
    if (!c) { cropCandidate = null; cropHits = 0; return; }
    if (sameCrop(c, cropCandidate)) cropHits++; else { cropCandidate = c; cropHits = 1; }
    if (cropHits >= 3) {
        crop = c; cropHits = 0;
        log("crop", `${c.w}x${c.h}+${c.x}+${c.y}`, "of", `${vw}x${vh}`);
    }
}

// ---------------------------------------------------------------------
// Magnifier. Only in the big viewer (not preview) and only when the mouse can
// reach the window at all (cursor visible; in a game the window is
// click-through). Click = 2x at that point / back to 1x; wheel = 1x..4x
// keeping the point under the cursor; drag = pan. Remembered per streamer.
// ---------------------------------------------------------------------
const zoom = { z: 1, cx: 0.5, cy: 0.5 };   // centre in 0..1 of the shown frame
const ZOOM_MAX = 4;
const elZoomBadge = document.getElementById("zoom-badge");

function zoomAllowed() { return !window.__vetPreview; }

// canvas pixel -> 0..1 position in the shown (cropped) frame at zoom 1
function frameFraction(clientX, clientY) {
    const r = elView.getBoundingClientRect();
    const px = (clientX - r.left) / r.width, py = (clientY - r.top) / r.height;
    // current visible window in 0..1 frame space
    const w = 1 / zoom.z, h = 1 / zoom.z;
    const left = Math.max(0, Math.min(1 - w, zoom.cx - w / 2));
    const top  = Math.max(0, Math.min(1 - h, zoom.cy - h / 2));
    return { fx: left + px * w, fy: top + py * h, px, py };
}

function setZoom(z, cx, cy, save = true) {
    zoom.z = Math.max(1, Math.min(ZOOM_MAX, z));
    if (zoom.z <= 1.001) { zoom.z = 1; }
    const half = 0.5 / zoom.z;
    zoom.cx = Math.max(half, Math.min(1 - half, cx));
    zoom.cy = Math.max(half, Math.min(1 - half, cy));
    elView.classList.toggle("zoomed", zoom.z > 1);
    elZoomBadge.textContent = zoom.z.toFixed(1).replace(/\.0$/, "") + "×";
    elZoomBadge.classList.toggle("show", zoom.z > 1);
    if (save) saveZoomSoon();
}

let zoomSaveTimer = null;
function saveZoomSoon() {
    clearTimeout(zoomSaveTimer);
    zoomSaveTimer = setTimeout(() => {
        fetch(API_BASE + "/video/zoom", { method: "POST", body: JSON.stringify({ z: zoom.z, cx: zoom.cx, cy: zoom.cy }) }).catch(() => {});
    }, 400);
}

function refreshZoomable() {
    const ok = zoomAllowed();
    elView.classList.toggle("zoomable", ok);
    if (!ok && zoom.z > 1) setZoom(1, 0.5, 0.5, false);
}

// Called by the overlay: preview on/off, and the saved zoom for this streamer.
window.__vetSetPreview = (on) => { window.__vetPreview = !!on; refreshZoomable(); };
window.__vetSetZoom = (zs) => {
    if (zs && zoomAllowed()) setZoom(Number(zs.z) || 1, Number(zs.cx) || 0.5, Number(zs.cy) || 0.5, false);
};

let dragStart = null;
elView.addEventListener("mousedown", (e) => {
    if (e.button !== 0 || !zoomAllowed()) return;
    dragStart = { x: e.clientX, y: e.clientY, cx: zoom.cx, cy: zoom.cy, moved: false };
});
window.addEventListener("mousemove", (e) => {
    if (!dragStart || zoom.z <= 1) return;
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    if (!dragStart.moved && Math.hypot(dx, dy) < 4) return;
    dragStart.moved = true;
    elView.classList.add("panning");
    const r = elView.getBoundingClientRect();
    setZoom(zoom.z, dragStart.cx - dx / r.width / zoom.z, dragStart.cy - dy / r.height / zoom.z);
});
window.addEventListener("mouseup", (e) => {
    const d = dragStart;
    dragStart = null;
    elView.classList.remove("panning");
    if (!d || d.moved || e.button !== 0 || !zoomAllowed()) return;
    if (e.target !== elView) return;
    if (zoom.z > 1) { setZoom(1, 0.5, 0.5); return; }
    const { fx, fy } = frameFraction(e.clientX, e.clientY);
    setZoom(2, fx, fy);
});
elView.addEventListener("wheel", (e) => {
    if (!zoomAllowed()) return;
    e.preventDefault();
    const { fx, fy, px, py } = frameFraction(e.clientX, e.clientY);
    const z = Math.max(1, Math.min(ZOOM_MAX, zoom.z * (e.deltaY < 0 ? 1.2 : 1 / 1.2)));
    // keep the point under the cursor where it is
    const w = 1 / z;
    setZoom(z, fx - (px - 0.5) * w, fy - (py - 0.5) * w);
}, { passive: false });

function drawOne(frame) {
    const vw = frame.displayWidth || frame.codedWidth || frame.width;
    const vh = frame.displayHeight || frame.codedHeight || frame.height;
    if (!vw || !vh) return;

    const now = performance.now();
    if (now - lastProbeAt > 1500) {
        lastProbeAt = now;
        try { probeCrop(frame, vw, vh); } catch (e) {}
    }

    let sx = crop ? crop.x : 0, sy = crop ? crop.y : 0;
    let sw = crop ? crop.w : vw, sh = crop ? crop.h : vh;
    reportAspect(sw, sh);
    if (zoom.z > 1) {
        const zw = sw / zoom.z, zh = sh / zoom.z;
        sx += Math.max(0, Math.min(sw - zw, zoom.cx * sw - zw / 2));
        sy += Math.max(0, Math.min(sh - zh, zoom.cy * sh - zh / 2));
        sw = zw; sh = zh;
    }
    const cw = elView.width;
    const ch = elView.height;
    const scale = Math.min(cw / sw, ch / sh);
    const dw = sw * scale, dh = sh * scale;
    const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    if (dw < cw - 1 || dh < ch - 1) {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, cw, ch);
    }
    ctx.drawImage(frame, sx, sy, sw, sh, dx, dy, dw, dh);
}

function targetFrames() { return Math.max(4, Math.round(BUFFER_MS * srcFps / 1000)); }

function tick(now) {
    raf = requestAnimationFrame(tick);
    bump("raf");
    const target = targetFrames();
    const maxFrames = Math.round(MAX_BUFFER_MS * srcFps / 1000);

    while (queue.length > maxFrames) { try { queue.shift().close(); } catch (e) {} gap.dropped++; }

    if (!playing) {
        if (queue.length < target) return;
        playing = true;
        nextDue = now;
    }
    if (queue.length === 0) { playing = false; gap.underruns++; return; }
    if (now < nextDue) return;

    // Base step from the source rate, nudged by how far the stock is from target
    // so the buffer neither drains nor grows over time.
    const base = 1000 / srcFps;
    const k = Math.max(-0.15, Math.min(0.15, (queue.length - target) / target * 0.15));
    const step = base * (1 - k);
    nextDue += step;
    if (now - nextDue > 100) nextDue = now + step;   // fell far behind (tab hidden etc.)

    const bmp = queue.shift();
    const t0 = performance.now();
    try { drawOne(bmp); } catch (e) { log("draw error:", e.message); }
    gap.slowDraw = Math.max(gap.slowDraw, performance.now() - t0);
    bump("draw");
    try { bmp.close(); } catch (e) {}
}

function startPlayout() { if (!raf) raf = requestAnimationFrame(tick); }

function clearQueue() {
    while (queue.length) { try { queue.shift().close(); } catch (e) {} }
    playing = false;
}

async function enqueueFrame(frame) {
    const now = performance.now();
    // Input rate = frames that arrived in the last 2 s (bursts average out).
    arrivals.push(now);
    while (arrivals.length && now - arrivals[0] > 2000) arrivals.shift();
    if (arrivals.length > 10 && now - arrivals[0] > 500) {
        const measured = (arrivals.length - 1) * 1000 / (now - arrivals[0]);
        srcFps = Math.max(10, Math.min(120, measured));
    }
    let bmp = null;
    try { bmp = await createImageBitmap(frame); }
    catch (e) { log("createImageBitmap:", e.message); }
    finally { try { frame.close(); } catch (e) {} }
    if (!bmp) return;
    queue.push(bmp);
    lastFrameAt = performance.now();
    if (reconnecting) endReconnect();
    startPlayout();
}

async function startReader(track) {
    if (!("MediaStreamTrackProcessor" in window)) {
        log("MediaStreamTrackProcessor unavailable");
        setStatus("WebCodecs unavailable");
        return;
    }
    if (readerLoopRunning) return;
    readerLoopRunning = true;
    const processor = new MediaStreamTrackProcessor({ track, maxBufferSize: 1 });
    const reader = processor.readable.getReader();
    log("reader started");
    setStatus("");
    try {
        while (true) {
            const { done, value: frame } = await reader.read();
            if (done) { log("reader done"); break; }
            framesFromReader++;
            bump("reader");
            enqueueFrame(frame);
        }
    } catch (e) {
        log("reader error:", e.message);
    } finally {
        readerLoopRunning = false;
    }
}

// Diagnostics: once a second log what the receiver got/decoded/froze.
let statsTimer = null;
let framesFromReader = 0;
// Largest gap (ms) between consecutive frames per second, at each stage:
// reader = frame came out of the decoder, draw = frame painted, raf = rAF ticks.
const gap = { dropped: 0, underruns: 0, reader: 0, draw: 0, raf: 0, lastReader: 0, lastDraw: 0, lastRaf: 0, slowDraw: 0 };
function bump(kind) {
    const now = performance.now();
    const k = "last" + kind[0].toUpperCase() + kind.slice(1);
    if (gap[k]) gap[kind] = Math.max(gap[kind], now - gap[k]);
    gap[k] = now;
}

function startStatsLog() {
    if (statsTimer) clearInterval(statsTimer);
    let prev = null;
    statsTimer = setInterval(async () => {
        if (!pc) return;
        try {
            const st = await pc.getStats();
            st.forEach(r => {
                if (r.type !== "inbound-rtp" || r.kind !== "video") return;
                const d = (k) => prev ? (r[k] || 0) - (prev[k] || 0) : 0;
                log("stats", JSON.stringify({
                    recv: d("framesReceived"), dec: d("framesDecoded"),
                    drop: d("framesDropped"), reader: framesFromReader,
                    lost: d("packetsLost"), nack: d("nackCount"),
                    pli: d("pliCount"), fir: d("firCount"),
                    freezes: r.freezeCount, keyframes: r.keyFramesDecoded,
                    jitterMs: Math.round((r.jitter || 0) * 1000),
                    decoder: r.decoderImplementation,
                    res: `${r.frameWidth}x${r.frameHeight}`,
                    fpsIn: r.framesPerSecond,
                    maxGapReader: Math.round(gap.reader),
                    maxGapDraw: Math.round(gap.draw),
                    maxGapRaf: Math.round(gap.raf),
                    slowDrawMs: Math.round(gap.slowDraw),
                    queue: queue.length, target: targetFrames(), srcFps: Math.round(srcFps),
                    underruns: gap.underruns, dropped: gap.dropped,
                    jbDelayMs: r.jitterBufferEmittedCount ? Math.round(r.jitterBufferDelay / r.jitterBufferEmittedCount * 1000) : null
                }));
                prev = r;
            });
            framesFromReader = 0;
            gap.reader = gap.draw = gap.raf = gap.slowDraw = gap.underruns = gap.dropped = 0;
        } catch (e) {}
    }, 1000);
}

// ---------------------------------------------------------------------
// Stall watchdog: no frames for STALL_MS (or connection lost) -> dim the
// last frame, show a spinner, and ask the overlay to reconnect. The overlay
// only forwards it to the plugin while the stream is still live; otherwise
// it closes this window on its own.
// ---------------------------------------------------------------------
const STALL_MS = 3000;
const RECONNECT_EVERY_MS = 12000;   // each attempt reloads this page and re-watches from scratch
let lastFrameAt = 0;
let reconnecting = false;
let reconnectSince = 0;
let lastReconnectReq = 0;
let reconnectAttempts = 0;
const elReconnect = document.getElementById("reconnect");
const elReconnectSub = document.getElementById("reconnect-sub");

function startReconnect(reason) {
    if (!reconnecting) {
        reconnecting = true;
        reconnectSince = performance.now();
        reconnectAttempts = 0;
        log("stall detected:", reason);
        elReconnect.classList.add("show");
    }
}

// The last frame survives the page reload done on reconnect (sessionStorage
// lives as long as the window), so the viewer never goes blank.
const LAST_FRAME_KEY = "vet:lastFrame";
const elLastFrame = document.getElementById("last-frame");
function saveLastFrame() {
    if (!lastFrameAt || !elView.width || !elView.height) return;
    try { sessionStorage.setItem(LAST_FRAME_KEY, elView.toDataURL("image/jpeg", 0.85)); } catch (e) {}
}
function showSavedFrame() {
    let url = null;
    try { url = sessionStorage.getItem(LAST_FRAME_KEY); } catch (e) {}
    if (!url) return;
    elLastFrame.src = url;
    elLastFrame.classList.add("show");
}
function hideSavedFrame() {
    if (!elLastFrame.classList.contains("show")) return;
    elLastFrame.classList.remove("show");
    elLastFrame.removeAttribute("src");
    try { sessionStorage.removeItem(LAST_FRAME_KEY); } catch (e) {}
}

function endReconnect() {
    reconnecting = false;
    hideSavedFrame();
    elReconnect.classList.remove("show");
    log("stream resumed after", Math.round(performance.now() - reconnectSince), "ms,", reconnectAttempts, "attempt(s)");
}

async function requestReconnect() {
    // Only grab the canvas while it still holds a real frame (first attempt);
    // after a reload it is blank and the stored frame is kept.
    if (!elLastFrame.classList.contains("show")) saveLastFrame();
    lastReconnectReq = performance.now();
    reconnectAttempts++;
    elReconnectSub.textContent = reconnectAttempts > 1 ? "Attempt " + reconnectAttempts : "";
    try {
        const r = await fetch(API_BASE + "/video/reconnect", {
            method: "POST", body: JSON.stringify({ attempt: reconnectAttempts })
        });
        const d = await r.json();
        log("reconnect request #" + reconnectAttempts, JSON.stringify(d));
        if (d && d.pluginAlive === false) elReconnectSub.textContent = "Discord plugin not responding";
        else if (d && d.live === false) elReconnectSub.textContent = "Stream not found";
    } catch (e) {
        log("reconnect request failed:", e.message);
    }
}

// Called by the overlay after it reloaded this page for a reconnect: keep
// the spinner up and keep retrying until frames come back.
window.__vetResumeReconnect = (attempts) => {
    const now = performance.now();
    showSavedFrame();
    startReconnect("page reloaded for reconnect");
    reconnectAttempts = attempts || 1;
    elReconnectSub.textContent = reconnectAttempts > 1 ? "Attempt " + reconnectAttempts : "";
    lastFrameAt = now - STALL_MS - 1;
    lastReconnectReq = now;
};

setInterval(() => {
    if (!lastFrameAt) return;           // never started yet
    const now = performance.now();
    if (!reconnecting && now - lastFrameAt > STALL_MS) startReconnect("no frames for " + Math.round(now - lastFrameAt) + " ms");
    if (reconnecting && now - lastReconnectReq > RECONNECT_EVERY_MS) requestReconnect();
}, 500);

async function handleOffer({ sdp, candidates }) {
    if (!sdp) return;
    log("offer received");
    if (pc) { try { pc.close(); } catch(e){} pc = null; }
    if (raf) { try { cancelAnimationFrame(raf); } catch(e){} raf = 0; }
    clearQueue();

    pc = new RTCPeerConnection({ iceServers: [] });

    pc.ontrack = (event) => {
        log("ontrack", event.track.kind);
        if (event.track.kind !== "video") return;

        setStatus("");
        startStatsLog();

        // WebCodecs pipeline — читаем кадры напрямую с трека.
        // <video> не нужен — рисуем через <canvas> в drawOne().
        startReader(event.track);
    };

    pc.onconnectionstatechange = () => {
        log("conn state:", pc.connectionState);
        if ((pc.connectionState === "failed" || pc.connectionState === "disconnected") && lastFrameAt) {
            startReconnect("connection " + pc.connectionState);
        }
        if (pc.connectionState === "connected") {
            setStatus("");
        }
    };

    try { await pc.setRemoteDescription(sdp); }
    catch (e) { log("setRemoteDescription:", e.message); setStatus("SDP error"); return; }
    for (const c of (candidates || [])) {
        try { await pc.addIceCandidate(c); } catch(e){}
    }

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await new Promise((resolve) => {
        if (pc.iceGatheringState === "complete") return resolve();
        const check = () => {
            if (pc.iceGatheringState === "complete") {
                pc.removeEventListener("icegatheringstatechange", check);
                resolve();
            }
        };
        pc.addEventListener("icegatheringstatechange", check);
        setTimeout(resolve, 1500);
    });
    const desc = pc.localDescription;
    log("sending answer");
    try {
        window.vetWebRTC.sendAnswer({
            sdp: { type: desc.type, sdp: desc.sdp },
            candidates: []
        });
    } catch(e) { log("sendAnswer failed:", e.message); }
}

if (window.vetWebRTC) {
    window.vetWebRTC.onOffer(handleOffer);
    window.vetWebRTC.ready();
    if (window.vetWebRTC.onAlphaState) {
        window.vetWebRTC.onAlphaState((alpha) => {
            const r = document.getElementById("alpha-range");
            const v = document.getElementById("alpha-val");
            const pct = Math.round((alpha ?? 1) * 100);
            if (r) r.value = String(pct);
            if (v) v.textContent = `${pct}%`;
        });
    }
} else {
    log("bridge missing");
    setStatus("Bridge missing");
}

document.getElementById("btn-close").addEventListener("click", () => {
    fetch(API_BASE + "/video/close", { method: "POST" }).catch(() => {});
});

document.getElementById("btn-pin").addEventListener("click", () => {
    fetch(API_BASE + "/video/preview", { method: "POST" }).catch(() => {});
});

const btnAlpha = document.getElementById("btn-alpha");
const alphaPop = document.getElementById("alpha-pop");
const alphaRange = document.getElementById("alpha-range");
const alphaVal = document.getElementById("alpha-val");

let _hideAlphaTimer = null;
function showAlphaPop() {
    if (_hideAlphaTimer) { clearTimeout(_hideAlphaTimer); _hideAlphaTimer = null; }
    alphaPop.classList.add("show");
    document.getElementById("controls").classList.add("show");
}
function scheduleHideAlphaPop() {
    if (_hideAlphaTimer) clearTimeout(_hideAlphaTimer);
    _hideAlphaTimer = setTimeout(() => {
        alphaPop.classList.remove("show");
        document.getElementById("controls").classList.remove("show");
        _hideAlphaTimer = null;
    }, 1500);
}

btnAlpha.addEventListener("click", (e) => {
    e.stopPropagation();
    if (alphaPop.classList.contains("show")) {
        alphaPop.classList.remove("show");
    } else {
        showAlphaPop();
        scheduleHideAlphaPop();
    }
});

alphaPop.addEventListener("mouseenter", () => {
    if (_hideAlphaTimer) { clearTimeout(_hideAlphaTimer); _hideAlphaTimer = null; }
});
alphaPop.addEventListener("mouseleave", () => scheduleHideAlphaPop());

alphaRange.addEventListener("input", () => {
    const pct = parseInt(alphaRange.value, 10) || 100;
    alphaVal.textContent = `${pct}%`;
    try {
        window.vetWebRTC?.setAlpha?.(pct / 100);
    } catch (e) {}
});
alphaRange.addEventListener("change", () => {
    scheduleHideAlphaPop();
});
</script>
</body>
